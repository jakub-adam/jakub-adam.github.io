<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jakub Adam</title>
<meta name="description" content="Jakub Adam. Social links and contact information.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060914">
<link rel="canonical" href="https://jakubadam.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="Jakub Adam">
<meta property="og:description" content="Social links and contact information.">
<meta property="og:url" content="https://jakubadam.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f46ff'/%3E%3Ctext x='32' y='46' font-size='42' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EJ%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #060914;
    --ink: #f4f6ff;
    --muted: #98a2c8;
    --glass: rgba(255,255,255,.055);
    --glass-hover: rgba(255,255,255,.09);
    --edge: rgba(255,255,255,.12);
    --edge-hover: rgba(255,255,255,.26);
    --cyan: #19d3ff;
    --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--cyan); color: #001018; }

  /* Background: the same blue, cyan and pink, as a static wash */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle 55vmax at 0% 0%, rgba(47,70,255,.4), transparent),
      radial-gradient(circle 55vmax at 100% 100%, rgba(25,211,255,.22), transparent),
      radial-gradient(circle 38vmax at 70% 40%, rgba(255,61,154,.13), transparent);
  }

  /* Card */
  .card { width: min(100%, 460px); padding: 40px 20px 24px; text-align: center; }
  @media (min-width: 560px) {
    .card {
      padding: 48px 32px 28px;
      background: var(--glass);
      border: 1px solid var(--edge);
      border-radius: 28px;
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      backdrop-filter: blur(22px) saturate(140%);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.6);
    }
  }

  /* Profile picture */
  .avatar { width: 120px; height: 120px; margin: 0 auto 22px; padding: 3px; border-radius: 50%; background: conic-gradient(from 200deg, #2f46ff, #19d3ff, #ff3d9a, #2f46ff); }
  .photo { position: relative; width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--bg); background: #10142b; overflow: hidden; display: grid; place-items: center; }
  .photo span { font-family: var(--serif); font-size: 2.4rem; letter-spacing: -.02em; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Name */
  h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 9vw, 2.9rem); line-height: 1.1; letter-spacing: -.03em; }
  .tag { margin: 8px 0 30px; color: var(--muted); }

  /* Links */
  .links { display: grid; gap: 12px; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px; text-align: left;
    color: var(--ink); text-decoration: none;
    background: var(--glass); border: 1px solid var(--edge); border-radius: 16px;
    transition: background-color .2s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover, .btn:focus-visible { background: var(--glass-hover); border-color: var(--edge-hover); }
  .btn:active { background: rgba(255,255,255,.12); }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .ico { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
  .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ig .ico { background: linear-gradient(45deg, #f9a825, #ee2a7b 55%, #6228d7); }
  .mail .ico { background: #2f46ff; }
  /* Icon colors for the placeholder links in the HTML (used once you enable them) */
  .li .ico { background: #0a66c2; }
  .gh .ico { background: #30363d; }
  .yt .ico { background: #e62117; }

  .txt { flex: 1; min-width: 0; }
  .txt b { display: block; font-weight: 600; font-size: 1.05rem; letter-spacing: -.01em; }
  .txt small { display: block; color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .go { flex: none; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); transition: color .2s; }
  .go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover .go, .btn:focus-visible .go { color: var(--ink); }

  /* Footer */
  .foot { margin: 28px 0 0; padding-top: 18px; border-top: 1px solid var(--edge); font-size: .8rem; color: var(--muted); letter-spacing: .02em; text-wrap: balance; }
</style>
</head>
<body>
