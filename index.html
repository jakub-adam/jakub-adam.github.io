<script>
/* Applies the saved theme before the page paints, so there is no flash */
(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);
document.documentElement.dataset.page=location.hash.replace(/^#\/?/,'').split('/')[0]||'home'})();
</script>
<!-- React and htm are loaded from a CDN, so there is no build step and no npm install -->

}}
